{% load soplax %}
<article class="video-card">
  <a class="video-card__link" href="{% url 'play' id=video.id %}">
    <div class="video-card__media{% if not video.miniatura %} video-card__media--placeholder{% endif %}"{% if video.miniatura %} data-skeleton{% endif %}>
      {% if video.miniatura %}
      <img class="video-card__thumb" alt="" width="640" height="360" decoding="async"
           {% if forloop.first and not featured_thumbnail %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
           src="{% if forloop.first and featured_thumbnail %}{{ featured_thumbnail }}{% else %}{{ video.miniatura.url }}{% endif %}">
      {% endif %}
      <span class="video-card__play" aria-hidden="true"><span class="icon-play"></span></span>
    </div>
    {% if query %}
    <h2 class="video-card__title">{{ video.nombre }}</h2>
    {% else %}
    <h3 class="video-card__title">{{ video.nombre }}</h3>
    {% endif %}
  </a>
  <p class="video-card__meta">{{ video.visitas|vistas }}</p>
</article>
