{% if slot %}
<div class="ad-slot ad-slot--{{ slot.format }} ad-device--{{ slot.device }}"
     data-ad-position="{{ slot.position }}" data-ad-device="{{ slot.device }}">
  <div class="ad-slot__creative{% if not slot.url %} ad-slot__creative--preview{% endif %}"
       {% if slot.url %}data-ad-url="{{ slot.url }}" data-ad-width="{{ slot.width }}" data-ad-height="{{ slot.height }}"{% endif %}></div>
  <p class="ad-slot__label">Publicidad</p>
</div>
{% endif %}
