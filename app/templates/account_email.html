{% extends "panel_base.html" %}

{% block page_title %}{{ title }}{% endblock %}
{% block panel %}
  <header class="panel__header">
    <p class="eyebrow"><span class="x-glyph" aria-hidden="true"></span>Tu cuenta</p>
    <h1 class="panel__title" id="panel-title">{{ title }}</h1>
    <p class="panel__lead">{{ instruction }}</p>
  </header>
  <form class="form" method="post" data-loading>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button class="button button--primary button--block button--lg" type="submit">Enviar</button>
  </form>
  <div class="panel__links">
    <a href="{% url 'login' %}">Volver al inicio de sesión</a>
  </div>
{% endblock %}
