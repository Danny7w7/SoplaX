{% extends "account_base.html" %}

{% block title %}{{ title }}{% endblock %}
{% block account %}
  <h1 class="h4 mb-3">{{ title }}</h1>
  <p>{{ instruction }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn first mt-4" type="submit">Enviar</button>
  </form>
  <p class="mt-4 mb-0"><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
{% endblock %}
