{% extends "account_base.html" %}

{% block title %}Completar registro{% endblock %}
{% block account %}
  <h1 class="h4 mb-4">Completar registro</h1>
  {% if form %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn first mt-4" type="submit">Crear cuenta</button>
    </form>
  {% else %}
    <p>El enlace de registro no está disponible.</p>
    <p class="mb-0"><a href="{% url 'register' %}">Solicitar un enlace nuevo</a></p>
  {% endif %}
{% endblock %}
