{% extends "account_base.html" %}

{% block title %}Completar registro{% endblock %}
{% block account %}
  <h1 id="account-title">Completar registro</h1>
  {% if form %}
    <form class="form-stack account-form" method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="button button--primary" type="submit">Crear cuenta</button>
    </form>
  {% else %}
    <p class="notice notice--error account-message">El enlace de registro no está disponible.</p>
    <a class="button button--primary account-action" href="{% url 'register' %}">Solicitar un enlace nuevo</a>
  {% endif %}
{% endblock %}
