{% extends "account_base.html" %}

{% block title %}Iniciar sesión{% endblock %}
{% block account %}
  <h1 class="h4 mb-4">Iniciar sesión</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="btn first mt-4" type="submit">Entrar</button>
  </form>
  <p class="mt-4"><a href="{% url 'recover' %}">¿Olvidaste tu contraseña?</a></p>
  <p class="mb-0"><a href="{% url 'register' %}">Crear cuenta</a></p>
{% endblock %}
