{% extends "account_base.html" %}

{% block title %}Iniciar sesión{% endblock %}
{% block account %}
  <h1 id="account-title">Iniciar sesión</h1>
  <form class="form-stack account-form" method="post">
    {% csrf_token %}
    {{ form.as_div }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button button--primary" type="submit">Entrar</button>
  </form>
  <nav class="account-links" aria-label="Opciones de cuenta">
    <a href="{% url 'recover' %}">¿Olvidaste tu contraseña?</a>
    <a href="{% url 'register' %}">Crear cuenta</a>
  </nav>
{% endblock %}
