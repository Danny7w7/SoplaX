{% extends "panel_base.html" %}

{% block page_title %}Iniciar sesión{% endblock %}
{% block panel %}
  <header class="panel__header">
    <p class="eyebrow"><span class="x-glyph" aria-hidden="true"></span>Tu cuenta</p>
    <h1 class="panel__title" id="panel-title">Iniciar sesión</h1>
  </header>
  <form class="form" method="post" data-loading>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button button--primary button--block button--lg" type="submit">Entrar</button>
  </form>
  <div class="panel__links">
    <a href="{% url 'recover' %}">¿Olvidaste tu contraseña?</a>
    <a href="{% url 'register' %}">Crear cuenta</a>
  </div>
{% endblock %}
