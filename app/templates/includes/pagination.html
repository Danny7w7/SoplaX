{% if page.has_other_pages %}
  <nav class="pagination" aria-label="Páginas de videos">
    {% if page.has_previous %}
      <a class="button button--secondary" href="?search={{ query|urlencode }}&amp;page={{ page.previous_page_number }}"
         rel="prev">Anterior</a>
    {% endif %}
    <span class="pagination__status">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a class="button button--secondary" href="?search={{ query|urlencode }}&amp;page={{ page.next_page_number }}"
         rel="next">Siguiente</a>
    {% endif %}
  </nav>
{% endif %}
