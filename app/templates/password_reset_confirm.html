{% extends "account_base.html" %}

{% block title %}Cambiar contraseña{% endblock %}
{% block account %}
  <h1 class="h4 mb-4">Cambiar contraseña</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn first mt-4" type="submit">Guardar contraseña</button>
    </form>
  {% else %}
    <p>El enlace de recuperación no está disponible.</p>
    <p class="mb-0"><a href="{% url 'recover' %}">Solicitar un enlace nuevo</a></p>
  {% endif %}
{% endblock %}
