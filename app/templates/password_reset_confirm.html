{% extends "account_base.html" %}

{% block title %}Cambiar contraseña{% endblock %}
{% block account %}
  <h1 id="account-title">Cambiar contraseña</h1>
  {% if validlink %}
    <form class="form-stack account-form" method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="button button--primary" type="submit">Guardar contraseña</button>
    </form>
  {% else %}
    <p class="notice notice--error account-message">El enlace de recuperación no está disponible.</p>
    <a class="button button--primary account-action" href="{% url 'recover' %}">Solicitar un enlace nuevo</a>
  {% endif %}
{% endblock %}
