{% extends "index.html" %}

{% block body %}
<main class="container-fluid pt-2" style="background-color: #101010;">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10">
      <div class="video-wrapper">
        <video id="my-video" controls playsinline preload="metadata" style="width: 100%; height: 100%;">
          <source src="{{ video.video.url }}" type="video/mp4">
        </video>
      </div>
      <h1 style="color: white;">{{ video.nombre }}</h1>
      <div class="description ps-2 pe-2">
        <p style="color: white;">{{ video.descripcion }}</p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
