{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cuenta{% endblock %} · SoplaX</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="bg-gradient_roaz">
  <main class="container min-vh-100 d-flex align-items-center py-4">
    <section class="col-12 col-sm-10 col-md-7 col-lg-5 mx-auto p-4 bg-light bordertop borderbutton">
      {% block account %}{% endblock %}
    </section>
  </main>
</body>
</html>
